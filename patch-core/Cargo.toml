[package]
# Underscore-form package name so the static library file (libpatch_core.a)
# matches what cargokit's build_pod.dart resolves from `crateInfo.packageName`.
# The workspace continues to find the crate at the `patch-core/` directory.
name = "patch_core"
version = "0.1.0"
edition = "2021"
description = "PATCH core engine — OSC transport, discovery, reliability."
license = "GPL-3.0-only"
repository = "https://github.com/vk0eppel/Patch"
homepage = "https://github.com/vk0eppel/Patch"

[lib]
name = "patch_core"
path = "src/lib.rs"
# cdylib + staticlib: required for linking into the Flutter app (FFI).
# rlib: keeps the crate usable from tests and other Rust consumers.
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Platform-correct data directory (config + show_files live here when bundled).
dirs = "5"

# Flutter ↔ Rust FFI bridge. Pinned to match the Dart-side `flutter_rust_bridge`
# package version in patch_app/pubspec.yaml — codegen produces glue that
# references symbols specific to this version.
flutter_rust_bridge = { version = "=2.12.0", features = ["chrono", "uuid", "rust-async"] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# OSC encoding/decoding
rosc = "0.10"

# mDNS / Bonjour discovery
mdns-sd = "0.11"

# Network interface enumeration
network-interface = "2"

# Serialization (config + sessions on disk, FRB types for Dart)
serde = { version = "1", features = ["derive"] }
# Used by osc/codec.rs to pack the channel-subscription list as a JSON
# string inside a single OSC argument.
serde_json = "1"

# Unique IDs
uuid = { version = "1", features = ["v4", "v5", "serde"] }

# Timestamps
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
# Subscriber so engine logs actually surface (stderr → visible under `flutter run`).
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config file (TOML)
toml = "0.8"

# Error handling
anyhow = "1"
thiserror = "2"

# In-process hostname lookup on Unix (avoids forking the `hostname` binary).
# Already present transitively (tokio→mio); declared here for direct use.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# MIDI input — bind macros to a Note On / Control Change (footswitch, pad,
# keyboard). Desktop only: midir uses CoreMIDI (macOS), WinMM (Windows), and
# ALSA (Linux — CI installs libasound2-dev). iOS/Android have no midir backend,
# so the `midi` module compiles to no-ops there (no dependency pulled in).
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
midir = "0.10"

[dev-dependencies]
tokio-test = "0.4"

[lints.rust]
# `frb_expand` is set by the flutter_rust_bridge macro during its own codegen
# expansion; declare it so the compiler doesn't flag it as an unknown cfg.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
