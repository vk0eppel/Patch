name: Release

# Build the desktop apps and attach them to a GitHub Release.
#
# Trigger: push a version tag, e.g.
#   git tag v1.0.0 && git push origin v1.0.0
# (or run manually from the Actions tab via workflow_dispatch).
#
# The release is created as a DRAFT so you can review the artifacts and notes
# before publishing. Artifacts are unsigned: macOS is ad-hoc signed
# (CODE_SIGN_IDENTITY = "-"), so first launch after opening the DMG shows a
# Gatekeeper warning (right-click → Open, or
# `xattr -dr com.apple.quarantine Patch.app`); Windows is unsigned, so the
# installer trips SmartScreen ("More info → Run anyway"); Linux ships a
# portable AppImage (`chmod +x` then run — no install step). Real codesigning/
# notarization would need certs added as repo secrets — out of scope here.
#
# NB the release name comes from the tag. Keep the tag aligned with
# patch_app/pubspec.yaml `version:` (which sets the in-app bundle version).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Pinned to match CI (ci.yml) + the validated local toolchain. The Rust
# version is pinned on the toolchain action's `uses:` ref below (GitHub
# disallows `${{ env }}` there), so it isn't an env var; keep it in step with
# ci.yml's `dtolnay/rust-toolchain@1.95.0`.
env:
  FLUTTER_VERSION: 3.44.1

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Flutter Linux desktop needs GTK + the CMake/Ninja toolchain; patch-core
      # links ALSA (midir) and audioplayers_linux links GStreamer. macOS/Windows
      # get their MIDI/audio backends from the OS (CoreMIDI/WinMM), so this is
      # Linux-only. Keep in step with ci.yml's build-linux job.
      - name: Install Linux build deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libasound2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      # cargokit compiles patch-core (cdylib/staticlib) during `flutter build`,
      # so the Rust toolchain must be present. macOS links CoreMIDI, Windows
      # WinMM — neither needs an extra system package (ALSA is Linux-only).
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.100.0

      - uses: Swatinem/rust-cache@v2

      - name: Install Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        working-directory: patch_app
        run: flutter pub get

      # Single source of truth for the artifact version — the same
      # pubspec.yaml `version:` that sets the in-app bundle version (per
      # CONVENTION.md's release process), so the filename and the shipped
      # app version can never disagree.
      - name: Read version
        id: version
        shell: bash
        working-directory: patch_app
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//' | cut -d'+' -f1)
          if [ -z "$VERSION" ]; then
            echo "Failed to parse version from pubspec.yaml" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # ── macOS ────────────────────────────────────────────────────────────
      - name: Add Rust targets (macOS universal)
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build macOS universal
        if: matrix.platform == 'macos'
        working-directory: patch_app
        # Universal (arm64 + x86_64) is driven by ARCHS in Runner.xcodeproj, not a flutter CLI flag.
        run: flutter build macos --release

      - name: Package macOS
        if: matrix.platform == 'macos'
        working-directory: patch_app/build/macos/Build/Products/Release
        # A DMG with Patch.app next to an /Applications symlink gives the
        # standard "drag to install" UX, instead of a bare zip.
        run: |
          mkdir dmg-staging
          cp -R Patch.app dmg-staging/
          ln -s /Applications dmg-staging/Applications
          hdiutil create -volname "Patch ${{ steps.version.outputs.version }}" \
            -srcfolder dmg-staging -ov -format UDZO \
            "$GITHUB_WORKSPACE/Patch-${{ steps.version.outputs.version }}-macos.dmg"

      # ── Windows ──────────────────────────────────────────────────────────
      - name: Build Windows
        if: matrix.platform == 'windows'
        working-directory: patch_app
        # audioplayers_windows uses <experimental/coroutine>, which newer MSVC
        # treats as a hard error (STL1011) rather than a deprecation warning.
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      - name: Package Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        # Compile the Inno Setup installer script. Preinstalled on
        # windows-latest runners as ISCC.exe.
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" `
            /DMyAppVersion=${{ steps.version.outputs.version }} `
            /DMySourceDir="${{ github.workspace }}\patch_app\build\windows\x64\runner\Release" `
            /DMyOutputDir="${{ github.workspace }}" `
            patch_app\windows\installer\patch.iss

      # ── Linux ────────────────────────────────────────────────────────────
      - name: Build Linux
        if: matrix.platform == 'linux'
        working-directory: patch_app
        run: flutter build linux --release

      - name: Package Linux (AppImage)
        if: matrix.platform == 'linux'
        working-directory: patch_app
        # A portable AppImage (single executable, no install) mirrors the
        # "download & run" UX of the macOS .dmg / Windows .exe. appimagetool is
        # itself an AppImage; APPIMAGE_EXTRACT_AND_RUN avoids needing FUSE on the
        # runner.
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          BUNDLE=build/linux/x64/release/bundle
          APPDIR=AppDir
          rm -rf "$APPDIR"
          mkdir -p "$APPDIR/usr/bin"
          cp -r "$BUNDLE"/. "$APPDIR/usr/bin/"
          cp assets/icon/icon_master.png "$APPDIR/patch.png"
          cat > "$APPDIR/patch.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Patch
          Exec=patch_app
          Icon=patch
          Categories=AudioVideo;Network;Utility;
          Terminal=false
          EOF
          cat > "$APPDIR/AppRun" <<'EOF'
          #!/bin/bash
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/patch_app" "$@"
          EOF
          chmod +x "$APPDIR/AppRun"
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          ARCH=x86_64 ./appimagetool-x86_64.AppImage "$APPDIR" \
            "$GITHUB_WORKSPACE/Patch-${{ steps.version.outputs.version }}-linux-x86_64.AppImage"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: patch-${{ matrix.platform }}
          path: |
            Patch-*.dmg
            Patch-*.exe
            Patch-*.AppImage
          if-no-files-found: error

  release:
    name: Publish draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release + upload assets
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.dmg
            artifacts/*.exe
            artifacts/*.AppImage
          generate_release_notes: true
          draft: true
