name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo (checkout) — no writes. Least privilege for the
# default GITHUB_TOKEN. (release.yml scopes `contents: write` on its own job.)
permissions:
  contents: read

jobs:
  rust:
    name: Rust engine — fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # midir (MIDI input) links ALSA on Linux — its -sys crate needs the dev
      # headers to build. macOS/Windows use CoreMIDI/WinMM (no extra packages).
      - name: Install ALSA dev headers (midir)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # Pinned to match the validated local toolchain so rustfmt/clippy output
      # is reproducible (a newer rustfmt/clippy can reformat or add lints and
      # turn `--check` / `-D warnings` red on unrelated changes).
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt -p patch_core --check

      - name: Clippy (deny warnings)
        run: cargo clippy -p patch_core --all-targets -- -D warnings

      - name: Test
        run: cargo test -p patch_core

  flutter:
    name: Flutter — analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned to the local version: pubspec requires Dart ^3.12, and the UI
      # uses Dart 3.12 features (e.g. `(_, _)` wildcard params).
      - name: Install Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Pub get
        working-directory: patch_app
        run: flutter pub get

      # Mirrors the Rust `cargo fmt --check` gate. Scoped to first-party dirs:
      # generated bindings (lib/src/rust) and vendored cargokit are excluded
      # via the analyzer config, and `dart format` has no --exclude flag.
      - name: Format check
        working-directory: patch_app
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        working-directory: patch_app
        run: flutter analyze

      - name: Test
        working-directory: patch_app
        run: flutter test

  # Compiles patch_core as a cdylib/staticlib and links it into the app the
  # same way a release build does, so native/link regressions (e.g. a missing
  # `-framework` in rust_builder/macos/patch_core.podspec — see CONVENTION.md
  # → Platform, ERRORS.md → Build/Release) fail the PR instead of first
  # surfacing at release-tag time. Also the only CI job that compiles
  # patch_core's macOS `cfg(target_os = ...)` paths (CoreMIDI/midir). Windows
  # (WinMM) stays covered by release.yml; a Windows build job can be added
  # here later if it proves worth the runner minutes.
  build-macos:
    name: macOS — native build smoke test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # cargokit invokes cargo during `flutter build`, so the same pinned Rust
      # as the `rust` job must be present. No `rustup target add` needed: a
      # host-arch debug build is enough to catch link/framework breakage (the
      # release job handles the universal arm64+x86_64 build).
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.100.0

      - uses: Swatinem/rust-cache@v2

      - name: Install Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Pub get
        working-directory: patch_app
        run: flutter pub get

      # Debug + no codesign: we only need the compile-and-link to succeed, not
      # a signed/notarized artifact.
      - name: Build macOS (debug, no codesign)
        working-directory: patch_app
        run: flutter build macos --debug

  # Linux counterpart of build-macos: compiles patch_core as a cdylib and links
  # it into the GTK app the same way a release build does, so Linux-specific
  # link/plugin regressions fail the PR instead of first surfacing at
  # release-tag time. Also the only CI job that compiles patch_core's Linux
  # `cfg(target_os = "linux")` paths (ALSA/midir). Keep the apt deps in step
  # with release.yml's "Install Linux build deps".
  build-linux:
    name: Linux — native build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libasound2-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      # cargokit invokes cargo during `flutter build`, so the same pinned Rust
      # as the `rust` job must be present.
      - name: Install Rust 1.95.0
        uses: dtolnay/rust-toolchain@1.100.0

      - uses: Swatinem/rust-cache@v2

      - name: Install Flutter 3.44.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Pub get
        working-directory: patch_app
        run: flutter pub get

      # Debug build: we only need compile-and-link to succeed, not an artifact.
      - name: Build Linux (debug)
        working-directory: patch_app
        run: flutter build linux --debug
